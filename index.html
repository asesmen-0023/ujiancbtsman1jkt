<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT SMAN 1 Jakarta - Secure Exam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans select-none" oncontextmenu="return false;">

    <!-- MODAL PERINGATAN PELANGGARAN / DISTRAKSI -->
    <div id="violationModal" class="fixed inset-0 bg-rose-950/90 backdrop-blur-md hidden flex items-center justify-center p-4 z-[9999]">
        <div class="bg-slate-900 border border-rose-500 rounded-2xl p-6 w-full max-w-sm text-center shadow-2xl">
            <div class="w-12 h-12 rounded-full bg-rose-500/20 text-rose-500 flex items-center justify-center mx-auto mb-3 font-bold text-2xl">
                ⚠️
            </div>
            <h3 class="text-lg font-black text-white mb-2">Terdeteksi Pelanggaran!</h3>
            <p id="violationReason" class="text-xs text-rose-200 leading-relaxed mb-4">
                Anda terdeteksi meninggalkan halaman ujian atau keluar dari mode layar penuh.
            </p>
            <div class="bg-slate-800 p-2.5 rounded-xl border border-slate-700 text-xs font-mono text-slate-300 mb-5">
                Jumlah Pelanggaran: <span id="violationCount" class="font-bold text-amber-400 text-sm">0</span> kali
            </div>
            <button onclick="resumeExam()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 rounded-xl text-xs transition">
                Kembali ke Ujian & Fullscreen
            </button>
        </div>
    </div>

    <!-- MODAL LOGIN SISWA -->
    <div id="studentLoginModal" class="fixed inset-0 bg-slate-950 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8 w-full max-w-md">
            <h2 class="text-2xl font-black text-white mb-1">Ujian Online (iOS / SEB)</h2>
            <p class="text-xs text-slate-400 mb-6">SMAN 1 Jakarta</p>
            
            <form id="studentLoginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">Pilih Angkatan / Server</label>
                    <select id="serverAngkatan" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl text-sm font-bold text-white outline-none">
                        <option value="X">Kelas X</option>
                        <option value="XI">Kelas XI</option>
                        <option value="XII">Kelas XII</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">NISN Siswa</label>
                    <input type="text" id="studentNisn" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl text-sm text-white outline-none" placeholder="Masukkan NISN Anda" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">Password Ujian</label>
                    <input type="password" id="studentPass" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl text-sm text-white outline-none" placeholder="Masukkan password" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-xl transition">Mulai Ujian</button>
            </form>
        </div>
    </div>

    <!-- HALAMAN UTAMA UJIAN (SETELAH LOGIN) -->
    <div id="examApp" class="hidden min-h-screen flex flex-col">
        <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center">
            <div>
                <h1 id="lblStudentName" class="font-bold text-sm text-white">-</h1>
                <p id="lblStudentClass" class="text-xs text-slate-400">-</p>
            </div>
            <button onclick="logoutExam()" class="bg-rose-600 hover:bg-rose-700 text-xs font-bold px-4 py-2 rounded-lg transition">Keluar Ujian</button>
        </header>

        <main class="flex-1 p-6 max-w-5xl mx-auto w-full">
            <h2 class="text-lg font-bold mb-4">Daftar Soal Ujian Tersedia</h2>
            <div id="examListContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- List soal dari Supabase akan dirender di sini -->
            </div>
        </main>
    </div>

    <script>
        // KONFIGURASI SUPABASE DISINKRONKAN AGAR BEBAS ERROR URL INVALID
        const SUPABASE_CONFIGS = {
            'X': { 
                url: 'https://ulroqkrnwzzrgkasrqit.supabase.co', 
                key: 'sb_publishable_DJm-HRJpia9X3CzOlBq61Q_Dqct-DPi' 
            },
            'XI': { 
                url: 'https://ulroqkrnwzzrgkasrqit.supabase.co', // Ganti dengan URL Supabase Dedicated XI Anda jika sudah tersedia
                key: 'sb_publishable_DJm-HRJpia9X3CzOlBq61Q_Dqct-DPi' // Ganti dengan Key Supabase Dedicated XI Anda
            },
            'XII': { 
                url: 'https://ulroqkrnwzzrgkasrqit.supabase.co', // Ganti dengan URL Supabase Dedicated XII Anda jika sudah tersedia
                key: 'sb_publishable_DJm-HRJpia9X3CzOlBq61Q_Dqct-DPi' // Ganti dengan Key Supabase Dedicated XII Anda
            }
        };

        let currentClient = null;
        let loggedInStudent = null;
        let violations = 0;
        let isExamActive = false;

        document.getElementById('studentLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const angkatan = document.getElementById('serverAngkatan').value;
            const nisn = document.getElementById('studentNisn').value.trim();
            const pass = document.getElementById('studentPass').value.trim();

            const config = SUPABASE_CONFIGS[angkatan];
            
            // Instansiasi client Supabase aman tanpa error URL
            if (typeof supabase !== 'undefined' && supabase.createClient) {
    currentClient = supabase.createClient(config.url, config.key, {
        auth: {
            persistSession: false, // Mematikan peringatan Multiple GoTrueClient
            autoRefreshToken: false
        }
    });
} else {
    alert('Library Supabase belum siap, periksa koneksi internet!');
    return;
}

            const { data, error } = await currentClient
                .from('students')
                .select('*')
                .eq('nisn', nisn)
                .maybeSingle();

            if (error || !data) {
                alert('NISN tidak ditemukan di database server ini!');
                return;
            }

            const validPassword = data.password ? data.password : data.nisn;
            if (pass !== validPassword) {
                alert('Password salah!');
                return;
            }

            loggedInStudent = data;
            isExamActive = true;
            
            document.getElementById('studentLoginModal').classList.add('hidden');
            document.getElementById('examApp').classList.remove('hidden');
            document.getElementById('lblStudentName').innerText = data.nama;
            document.getElementById('lblStudentClass').innerText = `Kelas: ${data.student_class} | NISN: ${data.nisn}`;

            requestFullscreenMode();
            loadAvailableExams(data.student_class);
        });

        async function loadAvailableExams(studentClass) {
            const { data, error } = await currentClient
                .from('exams')
                .select('*')
                .eq('is_active', true);

            const container = document.getElementById('examListContainer');
            if (error || !data || data.length === 0) {
                container.innerHTML = `<p class="text-slate-400">Belum ada soal ujian aktif saat ini.</p>`;
                return;
            }

            container.innerHTML = data.map(exam => `
                <div class="bg-slate-800 border border-slate-700 p-5 rounded-xl flex flex-col justify-between shadow-sm">
                    <div>
                        <span class="bg-blue-900 text-blue-200 text-[10px] font-bold px-2.5 py-1 rounded-full">${exam.student_class}</span>
                        <h3 class="font-bold text-white text-base mt-2">${exam.subject_name}</h3>
                    </div>
                    <button onclick="startExam('${exam.form_url}', '${exam.id}')" class="mt-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm transition">
                        Kerjakan Soal
                    </button>
                </div>
            `).join('');
        }

        function startExam(url, examId) {
            currentClient.from('exam_submissions').insert([{
                nisn: loggedInStudent.nisn,
                student_name: loggedInStudent.nama,
                student_class: loggedInStudent.student_class,
                subject_id: examId,
                is_completed: false
            }]).then(() => {
                window.location.href = url;
            });
        }

        function logoutExam() {
            isExamActive = false;
            location.reload();
        }

        // ==========================================
        // LOGIKA KEAMANAN & DETEKSI DISTRAKSI
        // ==========================================

        function triggerViolationNotice(reason) {
            if (!isExamActive) return;

            violations++;
            document.getElementById('violationReason').innerText = reason;
            document.getElementById('violationCount').innerText = violations;
            document.getElementById('violationModal').classList.remove('hidden');
        }

        function resumeExam() {
            document.getElementById('violationModal').classList.add('hidden');
            requestFullscreenMode();
        }

        function requestFullscreenMode() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(() => {});
            } else if (elem.webkitRequestFullscreen) { /* Safari / iOS */
                elem.webkitRequestFullscreen();
            }
        }

        // 1. Deteksi Pindah Tab / Minimalkan Browser
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                triggerViolationNotice('Dilarang berpindah tab atau meminimalkan browser!');
            }
        });

        // 2. Deteksi Kehilangan Fokus (Ter-distraksi Aplikasi Lain / Split Screen)
        window.addEventListener('blur', () => {
            triggerViolationNotice('Dilarang membuka/mengaktifkan aplikasi lain saat ujian!');
        });

        // 3. Deteksi Keluar dari Mode Layar Penuh (Fullscreen Change)
        const handleFullscreenChange = () => {
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
            if (!isFullscreen && isExamActive) {
                triggerViolationNotice('Layar ujian wajib dalam mode layar penuh (Fullscreen)!');
            }
        };

        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
    </script>
</body>
</html>
